<title>Agenda da Clínica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Protótipo da agenda compartilhada da clínica: folha do dia com uma coluna por sala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">

<div id="app"></div>

<div id="painel" class="painel" hidden>
  <button class="painel-fundo" data-acao="fechar" aria-label="Fechar" tabindex="-1"></button>
  <section class="painel-caixa" role="dialog" aria-modal="true" aria-labelledby="painel-titulo">
    <div class="painel-topo">
      <h2 id="painel-titulo"></h2>
      <button class="fechar" data-acao="fechar">Fechar</button>
    </div>
    <div id="painel-corpo" style="display:grid;gap:1rem"></div>
  </section>
</div>

<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

<script src="regras.js"></script>
<script src="dados.js"></script>
<script src="app.js"></script>
